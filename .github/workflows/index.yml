name: Index from Yana

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install opencode
        run: |
          mkdir -p ~/.opencode/bin
          curl -sL https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /tmp
          mv /tmp/opencode ~/.opencode/bin/opencode
          chmod +x ~/.opencode/bin/opencode
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode --version
      - name: Auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_KEY }}"}}' > ~/.local/share/opencode/auth.json
      - name: Fetch and index
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -e
          cd "${{ github.workspace }}"
          LAST=$(cat .yana_last_commit)
          CURRENT=$(git ls-remote "https://oauth2:$GITLAB_TOKEN@gitlab.wehive.digital/documentation/helpdesk.git" HEAD | awk '{print $1}')
          echo "Current: $CURRENT  Last: $LAST"
          if [ "$CURRENT" = "$LAST" ]; then echo "No changes."; exit 0; fi
          python3 fetch.py
          if [ ! -s files.txt ]; then echo "No new files."; echo "$CURRENT" > .yana_last_commit; exit 0; fi
          echo "=== Files ==="; cat files.txt
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            basename=$(basename "$path")
            echo "=== Index: $basename ==="
            opencode run "Index: $basename" --dir . --dangerously-skip-permissions --model opencode-go/deepseek-v4-flash --file prompt.txt 2>&1 || echo "FAILED: $basename"
          done < files.txt
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            rm -f "$(basename "$path")"
          done < files.txt
          rm -f files.txt
          echo "$CURRENT" > .yana_last_commit
      - name: Commit and push
        run: |
          git config user.name "QA Indexer Bot"
          git config user.email "bot@qa-indexer"
          git add -A
          if git diff --staged --quiet; then echo "No changes"; else git commit -m "Auto-index from Yana"; git push; echo "Pushed"; fi
